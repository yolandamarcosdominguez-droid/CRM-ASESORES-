<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrada · CRM Campaña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/common.css">
<link rel="stylesheet" href="/home/style.css">
</head>
<body>
<main class="gate-page">
  <div class="gate-box">

    <div class="gate-brand">
      <div class="gate-mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17h18"/><path d="M5 17V9l7-4 7 4v8"/><path d="M9 17v-4h6v4"/></svg>
      </div>
      <div>
        <h1>Portaaviones</h1>
        <p>Merced Telco · equipo en Lima, mercado España</p>
      </div>
    </div>

    <div>
      <p class="gate-q" style="margin-bottom:14px">¿Desde qué puesto entras? El CRM se configura solo según lo que hagas.</p>
      <div class="posts">

        <button type="button" class="post" data-rol="asesor" data-ir="/bandeja.html">
          <span class="post-ico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2" y="14" width="5" height="6" rx="2"/><rect x="17" y="14" width="5" height="6" rx="2"/><path d="M20 20v1a2 2 0 0 1-2 2h-4"/></svg>
          </span>
          <b>Asesor</b>
          <span>Recibes leads, llamas y ves cómo avanzan tus ventas por la cubierta. No mueves estaciones.</span>
        </button>

        <button type="button" class="post" data-rol="backoffice" data-ir="/backoffice.html">
          <span class="post-ico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M15 5h3a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3"/><path d="m9 13 2 2 4-4"/></svg>
          </span>
          <b>Back office</b>
          <span>La única mano sobre la ruta. Verificas y haces avanzar cada venta hasta que aterriza.</span>
        </button>

        <button type="button" class="post" data-rol="coordinador" data-ir="/equipo.html">
          <span class="post-ico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3 3 0 0 1 0 5M17.5 20a6 6 0 0 0-2-4.5"/></svg>
          </span>
          <b>Coordinador</b>
          <span>Las ventas de tu equipo, que puede ser grande. Reclamas revisiones y mandas correos.</span>
        </button>

        <button type="button" class="post" data-rol="supervisor" data-ir="/equipo.html">
          <span class="post-ico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
          <b>Supervisor</b>
          <span>Todo lo del coordinador, más las asistencias: quién fichó, quién llegó tarde, quién falta.</span>
        </button>

        <button type="button" class="post" data-rol="gerencia" data-ir="/campana.html">
          <span class="post-ico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-6M21 19H3"/></svg>
          </span>
          <b>Gerencia</b>
          <span>La campaña entera: coste por lead, aterrizajes, dónde se cae la venta. También fichas.</span>
        </button>

      </div>
    </div>

    <p class="gate-foot">Maqueta de diseño · los datos son de muestra. Todos los puestos fichan entrada y salida.</p>
  </div>
</main>

<script src="/home/app.js"></script>
</body>
</html>
